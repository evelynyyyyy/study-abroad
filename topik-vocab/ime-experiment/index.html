<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>simple-ime Engine Test</title><style>body{font:16px system-ui,-apple-system,sans-serif;max-width:780px;margin:auto;padding:18px}input,button{font:inherit;padding:8px;margin:4px}#candidates{display:flex;gap:6px;overflow-x:auto;padding:10px 0;flex-wrap:wrap}#candidates button{background:#f1f3f5;border:1px solid #ccd;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f6f6;padding:12px}</style></head><body><h1>simple-ime Engine Test</h1><p>独立浏览器测试页，不连接正式学习页面、键盘、FSRS 或 StudyScheduler。</p><p id="status">正在加载真正的 simple-ime Engine...</p><label>拼音 <input id="pinyin" value="chengwei" autocomplete="off" spellcheck="false"></label><button id="query">查询</button><button id="backspace">退格</button><button id="prev">上一页</button><button id="next">下一页</button><div>Composition: <strong id="composition"></strong></div><div>Candidate count: <strong id="count"></strong></div><div id="candidates"></div><div>Committed: <strong id="committed"></strong></div><pre id="debug"></pre><script src="./simple-ime-core.js"></script><script src="./simple-ime-adapter.js"></script><script>
const $=id=>document.getElementById(id);let adapter;function render(){const c=adapter.getCandidates();$('composition').textContent=adapter.getComposition();$('count').textContent=c.length;$('candidates').replaceChildren(...adapter.getPage().map(w=>{const b=document.createElement('button');b.textContent=w;b.onclick=()=>{const index=adapter.getCandidates().indexOf(w);$('committed').textContent+=adapter.selectCandidate(index)||'';render()};return b}));const debug={engine:'simple-ime',composition:adapter.getComposition(),candidateCount:c.length,candidates:c.slice(0,50)};$('debug').textContent=JSON.stringify(debug,null,2);console.log(debug)}
function query(){adapter.reset();for(const char of $('pinyin').value.toLowerCase())adapter.input(char);render()}
try{if(typeof SimpleImeCore==='undefined')throw Error('simple-ime-core.js not deployed');adapter=new TOPIK_SimpleImeAdapter(SimpleImeCore);adapter.init().then(()=>{$('status').textContent='Engine loaded: upstream simple-ime, not legacy pinyin map';query()});$('query').onclick=query;$('pinyin').oninput=query;$('backspace').onclick=()=>{adapter.backspace();$('pinyin').value=adapter.getComposition();render()};$('next').onclick=()=>{adapter.nextPage();render()};$('prev').onclick=()=>{adapter.previousPage();render()}}catch(e){$('status').textContent='Engine failed: '+e.message;console.error(e)}
</script></body></html>
