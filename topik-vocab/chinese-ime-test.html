<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese IME Test — Rime WASM POC</title><style>body{font:16px -apple-system,system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;background:#f5f5f7;color:#17171a}button,input{font:inherit;padding:9px}button{margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border-radius:8px}table{border-collapse:collapse;width:100%;background:white}td,th{border:1px solid #ddd;padding:6px;text-align:left}small{color:#666}</style></head><body><h1>Chinese IME Test</h1><p>独立引擎评估页面；不会修改学习进度、FSRS 或正式键盘。</p><p id="status">Rime WASM 尚未加载。仅运行旧引擎基线测试；Rime 结果必须在浏览器兼容构建接入后实测。</p><label>拼音 <input id="query" value="cheng" inputmode="none" autocomplete="off"></label><button id="lookup">查询旧引擎</button><pre id="output"></pre><button id="baseline">运行基线测试</button><button id="download">导出基线 JSON</button><pre id="summary"></pre><p><small>performance.now() 仅测当前浏览器 JS 候选查询；不等于 Rime WASM 初始化、网络、内存或 iPhone 实测。</small></p><script src="./pinyin-keyboard.js"></script><script src="./ime-engine-adapter.js"></script><script>
const cases={jian:'间',cheng:'成',shi:'时',yi:'一',li:'理',ji:'机',xue:'学',sheng:'生',gong:'工',zuo:'做',peng:'朋',you:'有',shijian:'时间',xuesheng:'学生',xuexi:'学习',gongzuo:'工作',fangjian:'房间',zhongjian:'中间',chengwei:'成为',keyi:'可以',ranhou:'然后',wozaijia:'我在家'};
let last=null;const $=id=>document.getElementById(id);
function lookup(){const py=$('query').value;const t=performance.now();const c=TOPIK_PINYIN.candidates(py);const ms=performance.now()-t;$('output').textContent=JSON.stringify({engine:'legacy',pinyin:py,composition:py,candidateCount:c.length,candidates:c,lookupMs:ms},null,2)}
function baseline(){let empty=0,missing=0,total=0,latency=0;const rows=[];for(const [py,target]of Object.entries(cases)){const t=performance.now();const c=TOPIK_PINYIN.candidates(py);const ms=performance.now()-t;empty+=!c.length;missing+=!c.includes(target);total++;latency+=ms;rows.push({py,target,count:c.length,found:c.includes(target),latencyMs:ms})}last={engine:'legacy',sampleSize:total,empty,missing,meanLookupMs:latency/total,rows,wasmDownloadBytes:null,wasmInitMs:null,peakMemoryBytes:null,iphoneSafariVerified:false};$('summary').textContent=JSON.stringify(last,null,2)}
$('lookup').onclick=lookup;$('baseline').onclick=baseline;$('download').onclick=()=>{if(!last)baseline();const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chinese-ime-legacy-baseline.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};lookup();
</script></body></html>
