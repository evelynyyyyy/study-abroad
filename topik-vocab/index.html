<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TOPIK 韩语词汇实验室</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f7f8f5;color:#1d3029;margin:0}.wrap{max-width:850px;margin:auto;padding:25px}.hero{background:#e2f1e7;padding:26px;border-radius:22px}h1{margin:5px 0 10px}p{color:#71847a;line-height:1.8}.levels,.tabs,.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{border:1px solid #dce7dd;background:white;padding:12px 15px;border-radius:12px;cursor:pointer;font:inherit}button.active,.primary{background:#16725b;color:white;border-color:#16725b}.card{background:white;border:1px solid #e2e8e2;padding:27px;border-radius:20px;margin-top:20px;min-height:320px}.word{text-align:center;font-size:54px;font-weight:750;margin:60px 0 18px}.hint{text-align:center;color:#89958d}.ans{text-align:center;font-size:24px;font-weight:700}.center{text-align:center}.buttons{justify-content:center}input{width:100%;box-sizing:border-box;border:1px solid #d7e4db;padding:14px;border-radius:12px;font:inherit}.row{border-bottom:1px solid #e5eae6;padding:12px;display:flex;justify-content:space-between;gap:12px}.row b{font-size:19px}.muted{font-size:13px;color:#78867c}.notice{padding:14px;border-radius:12px;background:#ecf6ee;margin:12px 0}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:15px 0}.stats strong{font-size:25px}.stats>div{background:white;padding:13px 20px;border-radius:13px;flex:1}.foot{margin:25px 0;font-size:12px;color:#7d8b82;line-height:1.8}@media(max-width:600px){.wrap{padding:14px}.word{font-size:45px}.card{padding:20px}.tabs button{flex:1;padding:10px 5px;font-size:12px}}</style></head><body><div class="wrap"><header><b>가 &nbsp;韩语词汇实验室</b> <span class="muted">TOPIK 1–6</span></header><div class="hero"><small>YOUR DAILY KOREAN PRACTICE</small><h1>每天进步一点点，<br>把韩语真正记住。</h1><p>适合初学者的认词、拼写和间隔复习。</p></div><div class="stats"><div>已掌握<br><strong id="master">0</strong></div><div>待复习<br><strong id="due">0</strong></div><div>总词数<br><strong id="total">0</strong></div></div><h3>选择学习等级</h3><div id="levels" class="levels"></div><div class="tabs" id="tabs"><button data-tab="flash">认词卡片</button><button data-tab="spell">拼写训练</button><button data-tab="review">间隔复习</button><button data-tab="list">词汇列表</button></div><div id="panel" class="card"></div><div class="foot">词汇为分级示例，并非 TOPIK 官方完整词库。可通过 CSV 导入更大词库。学习记录储存在当前浏览器，可手动导出备份；发音依赖浏览器韩语语音支持。</div></div><script>
const built=[
[1,"사람","人"],[1,"학교","学校"],[1,"학생","学生"],[1,"선생님","老师"],[1,"친구","朋友"],[1,"책","书"],[1,"물","水"],[1,"밥","饭"],[1,"집","家"],[1,"가족","家人"],[1,"오늘","今天"],[1,"내일","明天"],[1,"어제","昨天"],[1,"시간","时间"],[1,"이름","名字"],[1,"한국","韩国"],[1,"한국어","韩语"],[1,"공부하다","学习"],[1,"먹다","吃"],[1,"마시다","喝"],[1,"가다","去"],[1,"오다","来"],[1,"좋다","好"],[1,"크다","大"],[1,"작다","小"],[1,"많다","多"],[1,"없다","没有"],[1,"있다","有、在"],[1,"아침","早晨"],[1,"저녁","晚上"],[2,"시험","考试"],[2,"대학","大学"],[2,"여행","旅行"],[2,"약속","约定"],[2,"운동","运动"],[2,"건강","健康"],[2,"병원","医院"],[2,"교통","交通"],[2,"문화","文化"],[2,"계절","季节"],[2,"필요하다","需要"],[2,"준비하다","准备"],[2,"이해하다","理解"],[2,"설명하다","解释"],[2,"선택하다","选择"],[2,"비슷하다","相似"],[2,"다르다","不同"],[2,"중요하다","重要"],[2,"편리하다","方便"],[2,"경험","经历"],[3,"사회","社会"],[3,"문제","问题"],[3,"원인","原因"],[3,"결과","结果"],[3,"영향","影响"],[3,"환경","环境"],[3,"경제","经济"],[3,"교육","教育"],[3,"취업","就业"],[3,"인구","人口"],[3,"증가하다","增加"],[3,"감소하다","减少"],[3,"발생하다","发生"],[3,"해결하다","解决"],[3,"참여하다","参与"],[4,"발전","发展"],[4,"기술","技术"],[4,"정책","政策"],[4,"제도","制度"],[4,"자료","资料"],[4,"분석하다","分析"],[4,"조사하다","调查"],[4,"비교하다","比较"],[4,"예상하다","预测"],[4,"유지하다","维持"],[4,"제공하다","提供"],[4,"개선하다","改善"],[4,"예방하다","预防"],[4,"현상","现象"],[4,"인식","意识"],[5,"고령화","老龄化"],[5,"저출산","低生育率"],[5,"불평등","不平等"],[5,"지속가능성","可持续性"],[5,"부작용","副作用"],[5,"실효성","实际效果"],[5,"근거","依据"],[5,"논란","争议"],[5,"도입하다","引入"],[5,"촉진하다","促进"],[5,"완화하다","缓解"],[5,"반영하다","反映"],[6,"양극화","两极分化"],[6,"상충하다","相冲突"],[6,"불가피하다","不可避免"],[6,"시사하다","暗示、启示"],[6,"함축하다","蕴含"],[6,"간과하다","忽略"],[6,"도출하다","推导出"],[6,"규명하다","查明"],[6,"모색하다","寻求"],[6,"상쇄하다","抵消"],[6,"제고하다","提高"],[6,"전망하다","展望"]];let extra=JSON.parse(localStorage.getItem("topik_extra")||"[]");let records=JSON.parse(localStorage.getItem("topik_records")||"{}");let level=1,tab="flash",idx=0,reveal=false,checked=false,answer="";const all=()=>built.concat(extra),words=()=>all().filter(x=>+x[0]===level),due=x=>records[x[1]]&&records[x[1]].due<=Date.now(),queue=()=>tab==="review"?words().filter(due):words(),cur=()=>{let q=queue();return q.length?q[idx%q.length]:null};function stats(){document.querySelector("#master").textContent=Object.values(records).filter(r=>r.step>=4).length;document.querySelector("#due").textContent=all().filter(due).length;document.querySelector("#total").textContent=all().length}function speak(s){if(!speechSynthesis){alert("浏览器不支持朗读");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang="ko-KR";u.rate=.85;speechSynthesis.speak(u)}function save(w,correct){let r=records[w[1]]||{step:0};let step=correct?Math.min(r.step+1,6):0;let days=[0,1,3,7,14,30,60][step];records[w[1]]={step,due:Date.now()+days*86400000};localStorage.setItem("topik_records",JSON.stringify(records));idx++;reveal=false;checked=false;answer="";render()}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function dl(name,data){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}function render(){stats();document.querySelector("#levels").innerHTML=[1,2,3,4,5,6].map(n=>'<button class="'+(level===n?'active':'')+'" data-level="'+n+'">TOPIK '+n+' <span class="muted">('+all().filter(x=>+x[0]===n).length+')</span></button>').join("");document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{level=+b.dataset.level;idx=0;reveal=false;checked=false;render()});document.querySelectorAll("[data-tab]").forEach(b=>{b.classList.toggle("active",tab===b.dataset.tab);b.onclick=()=>{tab=b.dataset.tab;idx=0;reveal=false;checked=false;render()}});let w=cur(),p=document.querySelector("#panel");if(tab==="flash"||tab==="review"){p.innerHTML='<h3>'+(tab==="flash"?"韩语认词":"今日复习")+'</h3><p>先想起中文，再翻开答案；对错决定下次复习时间。</p>'+(w?'<div class="muted center">第 '+(idx%queue().length+1)+' / '+queue().length+' 词</div><div class="word">'+esc(w[1])+'</div>'+(reveal?'<div class="ans">'+esc(w[2])+'</div>':'<div class="hint">你认识这个词吗？</div>')+'<div class="buttons"><button id="speak">🔊 发音</button>'+(reveal?'<button id="bad">还不认识</button><button class="primary" id="good">记住了</button>':'<button class="primary" id="show">显示答案</button>')+'</div>':'<div class="notice">没有到期词汇。先学习新词吧！</div>');if(w){document.querySelector("#speak").onclick=()=>speak(w[1]);if(reveal){document.querySelector("#bad").onclick=()=>save(w,false);document.querySelector("#good").onclick=()=>save(w,true)}else document.querySelector("#show").onclick=()=>{reveal=true;render()}}}else if(tab==="spell"){p.innerHTML='<h3>拼写训练</h3><p>看到中文后，用韩语输入法拼出单词。</p>'+(w?'<div class="word" style="font-size:35px">'+esc(w[2])+'</div><input id="answer" lang="ko" placeholder="请输入对应的韩语词汇" value="'+esc(answer)+'"><div class="buttons"><button id="speak">🔊 听发音</button><button class="primary" id="check">检查</button><button id="skip">跳过</button></div>'+(checked?'<div class="notice">'+(answer.trim()===w[1]?"✅ 正确！":"正确写法："+esc(w[1]))+'</div><div class="buttons"><button class="primary" id="next">下一词 →</button></div>':''):'无词汇');if(w){document.querySelector("#answer").oninput=e=>answer=e.target.value;document.querySelector("#answer").onkeydown=e=>{if(e.key==="Enter"){if(checked)save(w,answer.trim()===w[1]);else{checked=true;render()}}};document.querySelector("#check").onclick=()=>{checked=true;render()};document.querySelector("#skip").onclick=()=>save(w,false);document.querySelector("#speak").onclick=()=>speak(w[1]);let n=document.querySelector("#next");if(n)n.onclick=()=>save(w,answer.trim()===w[1])}}else{p.innerHTML='<h3>TOPIK '+level+' 词汇列表</h3><input id="search" placeholder="搜索韩语或中文"><div class="buttons"><button id="csv">下载 CSV 模板</button><label><input type="file" id="upload" accept=".csv,text/csv"></label><button id="backup">导出学习进度</button></div><div class="muted">CSV 列：level,ko,zh。导入将自动过滤完全重复的韩语单词。</div><div id="rows"></div>';function showList(){let q=document.querySelector("#search").value;document.querySelector("#rows").innerHTML=words().filter(w=>(w[1]+w[2]).includes(q)).map(w=>'<div class="row"><b>'+esc(w[1])+'</b><span>'+esc(w[2])+'</span></div>').join("")}document.querySelector("#search").oninput=showList;showList();document.querySelector("#csv").onclick=()=>dl("topik-template.csv","level,ko,zh\n1,안녕하세요,你好\n6,함축하다,蕴含");document.querySelector("#backup").onclick=()=>dl("topik-progress.json",JSON.stringify({records,extra},null,2));document.querySelector("#upload").onchange=async e=>{let f=e.target.files[0];if(!f)return;let rows=(await f.text()).replace(/^\uFEFF/,"").trim().split(/\r?\n/).slice(1).map(s=>s.split(",")).filter(x=>x.length>=3&&+x[0]>=1&&+x[0]<=6&&x[1]&&x[2]);let known=new Set(all().map(w=>w[1]));rows=rows.filter(w=>{if(known.has(w[1]))return false;known.add(w[1]);return true});extra=extra.concat(rows);localStorage.setItem("topik_extra",JSON.stringify(extra));alert("成功导入 "+rows.length+" 个词");render()}}}render();
</script></body></html>
