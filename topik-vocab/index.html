<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="topik-version" content="3.8.1"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff"><script>
(function(){
 'use strict';
 const APP_VERSION='3.8.1';
 window.TOPIK_APP_VERSION=APP_VERSION;
 let build='加载中';
 window.TOPIK_BUILD=build;
 const updateBuild=()=>{
  const app=document.getElementById('app');
  if(!app)return;
  const candidates=app.querySelectorAll('p.tiny.muted');
  for(const el of candidates){
   if(!/^(版本|Version) v\d+\.\d+\.\d+/.test(el.textContent.trim()))continue;
   const label='Version v'+APP_VERSION+' · Build '+build;
   if(el.textContent!==label)el.textContent=label;
  }
 };
 // On reopening or returning to the tab, check the public HTML for a newer release.
 // Never touch learning storage; a normal reload revalidates the versioned assets.
 let checkingVersion=false;
 const checkVersion=async()=>{
  if(checkingVersion||document.visibilityState==='hidden')return;
  checkingVersion=true;
  try{
   const response=await fetch(location.pathname+'?topik-update-check='+Date.now(),{cache:'no-store'});
   if(!response.ok)return;
   const html=await response.text();
   const published=html.match(/<meta name="topik-version" content="([0-9.]+)">/)?.[1];
   if(published&&published!==APP_VERSION){
    const marker='topik:reload-version';
    if(sessionStorage.getItem(marker)!==published){
     sessionStorage.setItem(marker,published);
     location.replace(location.pathname+'?appv='+encodeURIComponent(published));
    }
   }
  }catch(_){}finally{checkingVersion=false}
 };
 window.TOPIK_CHECK_UPDATE=checkVersion;
 window.addEventListener('pageshow',checkVersion);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVersion()});
 document.addEventListener('DOMContentLoaded',()=>{
  const app=document.getElementById('app');
  if(app)new MutationObserver(updateBuild).observe(app,{childList:true,subtree:true});
  updateBuild();
  if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(regs=>{
   regs.filter(reg=>reg.scope.includes('/study-abroad/topik-vocab/')).forEach(reg=>reg.unregister());
  }).catch(()=>{});
  if('caches' in window)caches.keys().then(keys=>keys.filter(key=>/topik-vocab/i.test(key)).forEach(key=>caches.delete(key))).catch(()=>{});
  fetch('https://api.github.com/repos/evelynyyyyy/study-abroad/commits/gh-pages',{cache:'no-store'})
   .then(res=>res.ok?res.json():null).then(data=>{if(data?.sha){build=data.sha.slice(0,8);window.TOPIK_BUILD=build;updateBuild()}}).catch(()=>{});
 });
})();
