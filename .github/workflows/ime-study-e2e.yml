name: Study page simple-ime E2E
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/ime-study-e2e.yml'
      - 'topik-vocab/ime-experiment/production-smoke.cjs'
      - 'topik-vocab/app.js'
      - 'topik-vocab/index.html'
      - 'topik-vocab/hangul-keyboard.js'
      - 'topik-vocab/pinyin-keyboard.js'
      - 'topik-vocab/styles.css'
permissions:
  contents: read
jobs:
  study-page:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          node -e "console.log('Using preinstalled Chromium and WebKit from Playwright image')"
      - name: Measure pinned IME bundle compression
        run: |
          node -e "const fs=require('fs'),z=require('zlib');const b=fs.readFileSync('topik-vocab/ime-experiment/simple-ime-core.js');console.log(JSON.stringify({engine:'simple-ime',rawBytes:b.length,gzipBytes:z.gzipSync(b,{level:9}).length,brotliBytes:z.brotliCompressSync(b).length}))"
      - name: Test live study page with virtual keyboard
        run: node topik-vocab/ime-experiment/production-smoke.cjs
