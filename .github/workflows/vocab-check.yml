name: Check Korean vocabulary app
on:
  push:
    branches: [gh-pages]
    paths:
      - 'topik-vocab/**'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'topik-vocab/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check topik-vocab/app.js
          node --check topik-vocab/vocabulary.js
          node --check topik-vocab/study-context.js
          node --check topik-vocab/first-learning.js
      - name: Test first learning lifecycle and independent recall
        run: |
          node topik-vocab/tests/first-learning.test.cjs
      - name: Check site structure and title
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('topik-vocab/index.html','utf8');for(const x of ['TOPIK单词','./app.js','./study-context.js','./first-learning.js','./styles.css'])if(!h.includes(x))process.exit(1)"
          test -f topik-vocab/styles.css
          test -f topik-vocab/vocabulary.js
          test -f topik-vocab/study-context.js
          test -f topik-vocab/first-learning.js
          test -f topik-vocab/SKILL.md
