name: Check Korean vocabulary app
on:
  push:
    branches: [gh-pages]
    paths:
      - 'topik-vocab/**'
      - 'k/**'
  pull_request:
    branches: [gh-pages]
    paths:
      - 'topik-vocab/**'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check topik-vocab/theme.js
          node --check topik-vocab/pinyin-keyboard.js
          node --check topik-vocab/korean-ime-engine.js
          node --check topik-vocab/korean-ime-adapter.js
          node --check topik-vocab/hangul-keyboard.js
          node --check topik-vocab/answer-evaluator.js
          node --check topik-vocab/app.js
          node --check topik-vocab/vocabulary.js
          node --check topik-vocab/study-context.js
          node --check topik-vocab/first-learning.js
          node --check topik-vocab/smart-scheduler.js
          node --check topik-vocab/pronunciation.js
          node --check topik-vocab/relearn.js
          node --check topik-vocab/reset-progress.js
          node --check topik-vocab/lexicon-quality.js
      - name: Test first learning lifecycle and independent recall
        run: |
          node topik-vocab/tests/theme.test.cjs
          node topik-vocab/tests/pinyin-keyboard.test.cjs
          node topik-vocab/tests/hangul-keyboard.test.cjs
          node topik-vocab/tests/korean-ime.test.cjs
          node topik-vocab/tests/answer-evaluator.test.cjs
          node topik-vocab/tests/session-cooldown.test.cjs
          node topik-vocab/tests/first-learning.test.cjs
          node topik-vocab/tests/smart-scheduler.test.cjs
          node topik-vocab/tests/smart-progress.test.cjs
          node topik-vocab/tests/learning-fairness.test.cjs
          node topik-vocab/tests/pronunciation.test.cjs
          node topik-vocab/tests/relearn.test.cjs
          node topik-vocab/tests/reset-progress.test.cjs
          node topik-vocab/tests/vocabulary-expansion.test.cjs
          node topik-vocab/tests/lexicon-quality.test.cjs
      - name: Verify permanent URL and portable learning backups
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const entry=fs.readFileSync('k/index.html','utf8');
          const app=fs.readFileSync('topik-vocab/app.js','utf8');
          assert.ok(entry.includes('../topik-vocab/'),'Permanent short path must redirect to same-origin app');
          assert.ok(app.includes("const STORAGE='topik_lab_v2'"),'Local progress key must remain stable');
          for(const marker of ['id="export-data"','id="backup-upload"','async function importBackup','smartAnswerHistory'])assert.ok(app.includes(marker),'Missing portable backup feature: '+marker);
          console.log('Permanent URL and learning-data backup checks passed');
          NODE
      - name: Check site structure and title
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('topik-vocab/index.html','utf8');for(const x of ['TOPIK单词','./app.js','./study-context.js','./first-learning.js','./smart-scheduler.js','./pronunciation.js','./relearn.js','./reset-progress.js','./lexicon-quality.js','./styles.css'])if(!h.includes(x))process.exit(1)"
          test -f topik-vocab/hangul-keyboard.js
          test -f topik-vocab/styles.css
          test -f topik-vocab/vocabulary.js
          test -f topik-vocab/study-context.js
          test -f topik-vocab/first-learning.js
          test -f topik-vocab/smart-scheduler.js
          test -f topik-vocab/pronunciation.js
          test -f topik-vocab/relearn.js
          test -f topik-vocab/reset-progress.js
          test -f topik-vocab/lexicon-quality.js
          test -f topik-vocab/data/verified-expansion.js
          test -f topik-vocab/SKILL.md
