name: Browser smoke test live simple-ime
on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/ime-browser-test.yml'
      - 'topik-vocab/ime-experiment/browser-smoke.cjs'
permissions:
  contents: read
jobs:
  webkit-and-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browsers
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test LIVE GitHub Pages engine in WebKit and Chromium
        run: node topik-vocab/ime-experiment/browser-smoke.cjs
